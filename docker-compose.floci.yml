version: "3.8"

# Floci Docker Environment for CSPM Integration Testing
# This starts a local AWS-compatible emulator for testing the CSPM scanner.
#
# Usage:
#   docker compose -f docker-compose.floci.yml up -d
#   docker compose -f docker-compose.floci.yml down
#
# Security Note:
#   The Docker socket (/var/run/docker.sock) is mounted to allow Floci to
#   manage Docker-backed service containers. This grants significant control
#   over the Docker host and should ONLY be used for local development/testing.
#   Never use this configuration in production.

services:
  floci:
    image: floci/floci:latest
    container_name: cspm-floci
    ports:
      - "4566:4566"    # Main Floci endpoint (AWS API compatible)
      - "4510-4559:4510-4559"  # Optional: Port range for containerized services
    environment:
      # AWS-compatible credentials (Floci doesn't validate real AWS creds)
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      
      # Floci configuration
      - SERVICES=s3,iam,ec2,cloudtrail,rds,kms,lambda,sts,kms,logs
      - DEBUG=0
      - PERSISTENCE=0  # Set to 1 to persist data across restarts
      
      # Docker socket access (for containerized service emulation)
      - DOCKER_HOST=unix:///var/run/docker.sock
    
    volumes:
      # Docker socket - REQUIRED for Docker-backed service emulation
      # WARNING: Grants significant control over Docker host
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Optional: Persist Floci state (only if PERSISTENCE=1)
      # - floci_data:/var/lib/floci
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    restart: unless-stopped
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

# Optional: Named volume for persistence
# volumes:
#   floci_data:
#     driver: local